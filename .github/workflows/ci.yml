name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker build -t inky-frame:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name inky -p 5000:5000 inky-frame:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:5000/api/config > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs inky
          exit 1
